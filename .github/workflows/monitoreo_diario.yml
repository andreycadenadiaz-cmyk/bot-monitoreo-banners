name: Monitoreo Diario de Banners

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 AM (UTC 11:00)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite probarlo manualmente

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Ejecutar el Bot
      run: |
        python bot_banners.py

    - name: Guardar reporte Excel
      uses: actions/upload-artifact@v4
      with:
        name: reporte-excel-diario
        path: reporte_banners_diario.xlsx
