name: Monitoreo Diario de Banners

on:
  schedule:
    - cron: '0 8 * * *' # Todos los días a las 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl

      - name: Instalar navegadores Playwright
        run: |
          npx playwright install chromium --with-deps

      - name: Ejecutar Bot Scraper
        run: |
          python bot_banners.py

      - name: Guardar cambios e imágenes en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reporte_banners.json historico_banners.json capturas/ || true
          git commit -m "Auto-update banners y capturas [skip ci]" || exit 0
          git push
